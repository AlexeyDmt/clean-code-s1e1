<!DOCTYPE html>
<html>
  <HEAD>
    <title>Todo App</title>
    <link href='https://fonts.googleapis.com/css?family=Lato:300,400,700' rel='stylesheet'>
    <link rel="stylesheet" href="style.css" MEDIA="screen" charset="utf-8">
  </HEAD>
  <body>
    <div class="aaa todo-header">
      <img src="./eisenhower-matrix.jpg" class="todo-header__image">
      <a class='more_inf todo-header__link'
         href="https://goal-life.com/page/method/matrix-eisenhower">
        Want more details&quest;
      </a>
    </div>
    <div class="centered-main-page-element todo__container">
      <p id='topSectionForAddingElementToList' class="todo__top-section-for-adding-element-to-list">
        <label for="new-task" class="todo__top-section-for-adding-element-to-list__label">Add Item</label>
        <div class="task-row-wrapper task-row__wrapper">
          <input id='new-task'class="task task-row__input-data" type="text">
          <button class="task task-row__button">Add</button>
        </div>
      </p>
      <h3 class="todo__title">Todo</h3>
      <ul id='incompleteTasks' class="todo__incomplete-task-list">
        <li class="todo__incomplete-task-item">
          <input type='checkbox' class="incomplete-task__checkbox">
          <label class="task todo__task-label">Pay Bills</label>
          <input type="text" class="task todo__task-data">
          <button class="edit todo__edit">Edit</button>
          <button class="delete todo__delete"><img src="./remove.svg"></button>
        </li>
        <li class="todo__edit-mode">
          <input type="checkbox">
          <label class="task todo__task-label">Go Shopping</label>
          <input type="text" value="Go Shopping" class="task todo__task-data">
          <button class='edit todo__edit'>Save</button>
          <button class="delete todo__delete"><img src="./remove.svg"></button>
        </li>
      </ul>
      <h3 class="todo__title">Completed</h3>
      <ul id="completed-tasks" class="todo__completed-tasks">
        <li><input type="checkbox" class="completed-tasks__checkbox" checked>
          <label class="task todo__task-label">See the Doctor</label>
          <input type="text" class="task todo__task-data">
          <button class="edit todo__edit">Edit</button>
          <button class="delete todo__delete"><img src="./remove.svg"></button>
        </li>
      </ul>
    </div>
    <script SRC="app.js"></script>
  </body>
</html>
