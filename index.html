<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Todo App</title>
    <link href="https://fonts.googleapis.com/css?family=Lato:300,400,700" rel="stylesheet">
    <link rel="stylesheet" href="style.css" media="screen">
  </head>
  <body class="body">
    <header class="todo-header">
      <img src="./eisenhower-matrix.jpg" class="todo-header__image" alt="Eisenhower Matrix diagram with tasks">
      <a class="todo-header__link"
         href="https://goal-life.com/page/method/matrix-eisenhower">
        Want more details?
      </a>
      <h1 class="todo-header__title">ToDo App</h1>
   </header>
    <div class="todo-container">
      <section class="add-elem">
        <h2 class="add-elem__title">Add Item</h2>
        <div class="add-elem__wrapper">
          <input id="new-task" class="todo__input" type="text">
          <button class="todo__btn add-elem__submit-btn">Add</button>
        </div>
      </section>
      <section class="incomplete">
        <h2 class="todo__title">Todo</h2>
        <ul id="incomplete-tasks" class="tasks">
          <li class="task">
            <input type="checkbox" class="todo__input task__checkbox">
            <label class="task__label">Pay Bills</label>
            <input type="text" class="todo__input task__text">
            <button class="todo__btn todo__btn--edit">Edit</button>
            <button class="todo__btn delete"><img class="delete__img" src="./remove.svg" alt="Delete task"></button>
          </li>
          <li class="task">
            <input type="checkbox" class="todo__input task__checkbox">
            <label class="task__label">Go Shopping</label>
            <input type="text" value="Go Shopping" class="todo__input task__input task__text">
            <button class="todo__btn todo__btn--edit">Edit</button>
            <button class="todo__btn delete"><img class="delete__img" src="./remove.svg" alt="Delete task"></button>
          </li>
        </ul>
      </section>
      <section class="completed">
        <h2 class="todo__title">Completed</h2>
        <ul id="completed-tasks" class="tasks">
          <li class="task">
            <input type="checkbox" class="todo__input task__checkbox" checked>
            <label class="task__label">See the Doctor</label>
            <input type="text" class="todo__input task__input task__text">
            <button class="todo__btn todo__btn--edit">Edit</button>
            <button class="todo__btn delete"><img class="delete__img" src="./remove.svg" alt="Delete task"></button>
          </li>
        </ul>
      </section>
    </div>
    <script src="app.js"></script>
  </body>
</html>
